name: 실시간 자료 수집 (S-DoT · 기상청)

on:
  schedule:
    - cron: "17 * * * *"   # 매시 17분(UTC 기준, 한국 시간도 매시 17분)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: sdot-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: S-DoT 받아오기
        continue-on-error: true
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          SDOT_SERVICE: ${{ vars.SDOT_SERVICE }}
        run: python scripts/fetch_sdot.py

      - name: 기상청 실황·예보 받아오기
        continue-on-error: true
        env:
          KMA_API_KEY: ${{ secrets.KMA_API_KEY }}
        run: python scripts/fetch_kma.py

      - name: 결과 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/realtime.json data/_debug_fields.json data/kma.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "실시간 자료 자동 갱신 $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi
